[project]
name = "watcher"
version = "0.1.0"
description = "Agent that collects local government activity by zipcode and reports on it weekly."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["watcher"]
package-data = { watcher = ["schema.sql"] }
